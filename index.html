<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olles lille musikskole</title>
<style>
  :root {
    --forest: #26332C;
    --forest-deep: #1C2620;
    --cream: #F2EEE3;
    --ink: #262B22;
    --gold: #9C7419;
    --rose: #A54964;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, var(--forest) 0%, var(--forest-deep) 100%);
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 16px;
    min-height: 100vh;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--cream);
    border-radius: 24px;
    padding: 40px 32px;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
    text-align: center;
  }
  p.eyebrow {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--rose);
    font-weight: 700;
    margin: 0 0 10px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    line-height: 1.2;
    margin: 0 0 14px;
    color: var(--ink);
  }
  h1 em { font-style: italic; color: var(--gold); }
  p.sub { color: #6b6558; font-size: 14px; margin: 0; line-height: 1.6; }
  a.link {
    display: inline-block;
    margin-top: 24px;
    color: var(--forest);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid var(--forest);
    padding-bottom: 2px;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Olles lille musikskole</p>
    <h1>Elev<em>portal</em> — under opbygning</h1>
    <p class="sub">Denne side bliver hjemmet for elevernes egen portal (login, kommende lektioner, materiale fra Olle m.m.). Indtil da finder du tilmeldingsformularen her:</p>
    <a class="link" href="/tilmelding">Gå til tilmelding →</a>
  </div>
</body>
</html>
